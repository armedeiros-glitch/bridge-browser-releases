name: Bridge OAuth DCR smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dcr-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe dynamic OAuth client registration
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS \
            -X POST 'https://aenmxjmrhancvqgpunhk.supabase.co/auth/v1/oauth/clients/register' \
            -H 'content-type: application/json' \
            --data '{"client_name":"Bridge Browser DCR Smoke","redirect_uris":["https://example.com/bridge-dcr-smoke"],"token_endpoint_auth_method":"none","grant_types":["authorization_code","refresh_token"],"response_types":["code"]}' \
            -o response.json \
            -w '%{http_code}')
          echo "HTTP_STATUS=$code"
          cat response.json
          echo
          python - "$code" <<'PY'
          import json, sys
          code=int(sys.argv[1])
          with open('response.json','r',encoding='utf-8') as f:
              data=json.load(f)
          if not 200 <= code < 300:
              raise SystemExit(f'DCR_FAILED status={code} response={data}')
          assert data.get('client_id'), data
          assert data.get('client_name') == 'Bridge Browser DCR Smoke', data
          print('DCR_OK')
          print('client_id=' + data['client_id'])
          print('token_endpoint_auth_method=' + str(data.get('token_endpoint_auth_method')))
          PY
          # Triggered after final OAuth Server save to verify DCR persisted.
