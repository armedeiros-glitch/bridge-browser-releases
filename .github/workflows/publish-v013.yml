name: Publish Bridge Browser v0.13.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v013.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZIP_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-beb0-820e-ac56-737193696860/raw?se=2026-09-09T02%3A30%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=5744c422-d796-53c1-bd15-0ac9237940ee&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T19%3A13%3A31Z&ske=2026-09-09T19%3A13%3A31Z&sks=b&skv=2026-02-06&sig=/KR3wlmvbUClv8L0Ad4erJEV%2Br39ans9FWactSxtKhw%3D'
      ZIP_SHA256: 'eed3b57a44a8b3117fe214fe0fee10c7995bf4cd61eb2e9d2f9ac95e98f4db21'
      EXE_SHA256: 'bcd4325e882f35d1564b9dada04c9bc959bb23def3b66b0804d31f00f8ba6ab6'
      EXE_SIZE: '110471327'
      EXE_NAME: 'Bridge-Browser-Setup-0.13.0.exe'
    steps:
      - name: Download verified Windows artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ZIP_URL" -o installer.zip
          echo "$ZIP_SHA256  installer.zip" | sha256sum -c -
          unzip -j installer.zip "$EXE_NAME" -d out
          echo "$EXE_SHA256  out/$EXE_NAME" | sha256sum -c -
          test "$(stat -c '%s' "out/$EXE_NAME")" = "$EXE_SIZE"
      - name: Create release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.13.0 "out/$EXE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bridge Browser v0.13.0" \
            --notes "Connect ChatGPT now opens the hosted Bridge authorization page instead of raw HTML."
