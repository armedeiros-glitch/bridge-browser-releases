name: Publish Bridge Browser v0.16.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0163.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZIP_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-e050-8230-9851-8ab26ac9c830/raw?se=2026-09-16T15%3A03%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=1f090607-80ce-58f1-b13a-1ead85a45098&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A13%3A17Z&ske=2026-09-16T19%3A13%3A17Z&sks=b&skv=2026-02-06&sig=YSvyOcDWCmAqltpgI08fhHscnj99T9wZschL1Eje18c%3D'
      ZIP_SHA256: '161d338245604b7081642c8b8f88e7533ecaffc8b12e89348c7230bec3d756c8'
      EXE_SHA256: '6d29976da001f9973b70a8f5018b917fba01ebc0414deb133be471e584a18ce1'
      EXE_SIZE: '112527829'
      EXE_NAME: 'Bridge-Browser-Setup-0.16.3.exe'
    steps:
      - name: Download verified Windows artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ZIP_URL" -o installer.zip
          echo "$ZIP_SHA256  installer.zip" | sha256sum -c -
          unzip -j installer.zip "$EXE_NAME" -d out
          echo "$EXE_SHA256  out/$EXE_NAME" | sha256sum -c -
          test "$(stat -c '%s' "out/$EXE_NAME")" = "$EXE_SIZE"
      - name: Create release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.16.3 "out/$EXE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bridge Browser v0.16.3" \
            --notes "Hardens background capture and active-device routing, adds zero-touch connection recovery and richer connection-state guidance, and improves Bridge connection reliability. Windows installer is unsigned."
