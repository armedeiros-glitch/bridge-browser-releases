name: Publish Bridge Browser v0.8.0 EXE

on:
  push:
    paths:
      - '.github/workflows/publish-v080-exe.yml'

permissions:
  contents: write

jobs:
  publish-exe:
    runs-on: ubuntu-latest
    env:
      ZIP_URL: 'https://github.com/armedeiros-glitch/bridge-browser-releases/releases/download/v0.8.0/Bridge-Browser-0.8.0-win-x64.zip'
      ZIP_SHA256: '565adf32fb433a6638cb0b84888f03bfc02c46733cbef3c3a90557ffb39930f3'
      EXE_SHA256: 'b1438813c27c3e66780ca90e98f1b0c889b78c1125d05057169b3e368c70761d'
    steps:
      - uses: actions/checkout@v4
      - name: Download published binary package
        run: curl --fail --location --retry 3 "$ZIP_URL" --output release.zip
      - name: Verify package and extract installer
        shell: bash
        run: |
          test "$(sha256sum release.zip | awk '{print $1}')" = "$ZIP_SHA256"
          unzip -j release.zip '*.exe' -d extracted
          exe="$(find extracted -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$exe"
          test "$(sha256sum "$exe" | awk '{print $1}')" = "$EXE_SHA256"
          cp "$exe" Bridge-Browser-Setup-0.8.0.exe
      - name: Upload direct installer to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.8.0 Bridge-Browser-Setup-0.8.0.exe --repo "$GITHUB_REPOSITORY" --clobber
