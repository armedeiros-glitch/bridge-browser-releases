name: Publish Bridge Browser v0.8.0

on:
  push:
    paths:
      - '.github/workflows/publish-v080.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2d90-820e-8a7b-a0cb152e8cf4/raw?se=2026-09-08T23%3A28%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=5e9764fc-ed36-56ec-83c6-5bbc72b7efa7&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T08%3A10%3A27Z&ske=2026-09-09T08%3A10%3A27Z&sks=b&skv=2026-02-06&sig=eyetHwQ9DgGwSef1REp3SJmaBGN2mgj7Jj4rTk7JWDg%3D'
      EXPECTED_SHA256: '565adf32fb433a6638cb0b84888f03bfc02c46733cbef3c3a90557ffb39930f3'
      ASSET: 'Bridge-Browser-0.8.0-win-x64.zip'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled Windows artifact
        run: curl --fail --location --retry 3 "$SOURCE_URL" --output "$ASSET"
      - name: Verify artifact checksum
        shell: bash
        run: |
          actual="$(sha256sum "$ASSET" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
      - name: Publish binary-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.0 "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Bridge Browser v0.8.0' \
            --notes 'Windows x64 alpha release. Binary-only distribution package. SHA-256: 565adf32fb433a6638cb0b84888f03bfc02c46733cbef3c3a90557ffb39930f3'
