name: Publish Bridge Browser v0.9.0

on:
  push:
    paths:
      - '.github/workflows/publish-v090.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b3d0-820e-943e-5ed60daae597/raw?se=2026-09-08T23%3A36%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=15563e92-fc83-551d-b905-66bcb1ec4769&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T11%3A26%3A49Z&ske=2026-09-09T11%3A26%3A49Z&sks=b&skv=2026-02-06&sig=0%2B9L7MixBCW0KPyogIUxYP/zWyDBkGx/7MdqRKHYtS0%3D'
      ZIP_SHA256: '513f1116a784e9f90058ebe9ef40ff9742be46f6841b64f5d60a019297fbac56'
      EXE_SHA256: '9e1718e3cdfcd7afac89316fd9e9ad21d99b67110de82ad4dc1faffdc7d29e09'
      ZIP_ASSET: 'Bridge-Browser-0.9.0-win-x64.zip'
      EXE_ASSET: 'Bridge-Browser-Setup-0.9.0.exe'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled Windows artifact
        run: curl --fail --location --retry 3 "$SOURCE_URL" --output "$ZIP_ASSET"
      - name: Verify package and installer
        shell: bash
        run: |
          test "$(sha256sum "$ZIP_ASSET" | awk '{print $1}')" = "$ZIP_SHA256"
          unzip -j "$ZIP_ASSET" '*.exe' -d extracted
          exe="$(find extracted -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$exe"
          test "$(sha256sum "$exe" | awk '{print $1}')" = "$EXE_SHA256"
          cp "$exe" "$EXE_ASSET"
      - name: Publish binary-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.0 "$ZIP_ASSET" "$EXE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Bridge Browser v0.9.0' \
            --notes 'Auto-update validation release. Windows x64. EXE SHA-256: 9e1718e3cdfcd7afac89316fd9e9ad21d99b67110de82ad4dc1faffdc7d29e09'
