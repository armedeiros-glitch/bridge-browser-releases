<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://aenmxjmrhancvqgpunhk.supabase.co https://esm.sh; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
<title>EmbrasAI | Recuperar senha</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#101216;color:#f4f4f6}
main{width:min(100%,460px)}header{display:flex;align-items:center;gap:10px;margin-bottom:23px;font-weight:750}
mark{display:grid;place-items:center;width:38px;height:38px;background:#ff8834;border-radius:10px;color:#161616;font-weight:800}
section{padding:26px;border:1px solid #333942;background:#1b1e24;border-radius:18px;box-shadow:0 20px 50px #0005}
h1{font-size:25px;margin:5px 0 9px;letter-spacing:-.5px}p{color:#aeb2bc;font-size:14px;line-height:1.5}
label{font-size:13px;font-weight:650;display:block;margin:17px 0 6px}
input{display:block;width:100%;padding:13px;border:1px solid #444a55;border-radius:10px;color:#fff;background:#101216;font:inherit}
button{width:100%;margin-top:19px;padding:13px;font:inherit;font-weight:700;background:#ff8834;color:#151515;border:0;border-radius:10px;cursor:pointer}
button[disabled]{opacity:.5}a{display:block;margin-top:16px;text-align:center;color:#ffaf72;text-decoration:underline;font-size:14px}
small{color:#aeb2bc}#notice{margin-top:17px;min-height:22px;font-size:13px;color:#aeb2bc}#notice.error{color:#ffa1a1}#notice.ok{color:#89e1b1}
</style>
</head>
<body><main>
<header><mark>E</mark> EmbrasAI</header>
<section>
<small>Recuperação da conta existente</small>
<h1>Escolha uma nova senha</h1>
<p>O link enviado ao teu e-mail autoriza a troca da senha original do EmbrasAI. Não é outro cadastro.</p>
<form id="form" hidden>
<label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">Confirme a nova senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button id="save" type="submit">Atualizar senha</button>
</form>
<div id="notice" role="status" aria-live="polite">Validando o link de recuperação...</div>
<a id="back" href="https://embrasai-p1-mobile-staging.vercel.app/">Voltar ao EmbrasAI</a>
</section>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://aenmxjmrhancvqgpunhk.supabase.co','sb_publishable_UofCGoeTB-E3vJyWJXUepQ_U5Ka5tcM',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('form');
const notice=document.getElementById('notice');
const label=(message,status='')=>{notice.textContent=message;notice.className=status};
let hasRecoverySession=false;
async function check(){
 const {data,error}=await sb.auth.getSession();
 if(error||!data?.session){form.hidden=true;label('O link expirou ou não foi reconhecido. Volta ao EmbrasAI e solicita uma nova recuperação.','error');return}
 hasRecoverySession=true;form.hidden=false;
 label('Link validado. Escolhe tua nova senha.','ok');
 // Preserve a valid Supabase session but remove recovery tokens from visible history.
 const url=new URL(location.href);
 url.hash='';
 url.searchParams.delete('auth');
 history.replaceState(null,'',url.pathname+url.search);
}
sb.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session){hasRecoverySession=true;form.hidden=false;label('Link validado. Escolhe tua nova senha.','ok')}
});
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const first=document.getElementById('password').value,second=document.getElementById('confirm').value;
 if(first.length<8){label('Use pelo menos 8 caracteres.','error');return}
 if(first!==second){label('As senhas não conferem.','error');return}
 if(!hasRecoverySession){label('Precisa abrir um link válido de recuperação.','error');return}
 const btn=document.getElementById('save');btn.disabled=true;
 try{
  const {error}=await sb.auth.updateUser({password:first});
  if(error)throw error;
  document.getElementById('password').value='';
  document.getElementById('confirm').value='';
  form.hidden=true;
  label('Senha atualizada. Volta ao EmbrasAI e entra com essa senha.','ok');
 }catch(err){label('Não foi possível atualizar a senha: '+err.message,'error')}
 finally{btn.disabled=false}
});
await check();
</script></body></html>
